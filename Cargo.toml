[workspace]
members = ["src/rust/core", "src/rust/cli"]
resolver = "2"

[workspace.package]
authors = ["Christian Helle"]
edition = "2024"
homepage = "https://christianhelle.com/curlgenerator/"
license = "GPL-3.0-only"
repository = "https://github.com/christianhelle/curlgenerator"
rust-version = "1.96"
version = "0.4.1"

[workspace.dependencies]
azure_core = "1.0.0"
azure_identity = "1.0.0"
clap = { version = "4.6.1", features = ["derive"] }
console = "0.16.3"
curlgenerator-core = { version = "0.4.1", path = "src/rust/core" }
exceptionless = "0.1.0"
pollster = "0.4.0"
regex = "1.12.2"
reqwest = { version = "0.12.28", default-features = false, features = [
  "blocking",
  "gzip",
  "rustls-tls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
url = "2.5.7"
yaml_serde = "0.10.4"

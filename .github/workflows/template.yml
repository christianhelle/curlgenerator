name: Run Tests

on:
  workflow_call:
    inputs:
      openapi:
        required: true
        type: string
      format:
        required: true
        type: string
      version:
        required: true
        type: string
      os:
        type: string
        default: ubuntu-latest

jobs:

  test:

    name: ${{ inputs.openapi }}.${{ inputs.format }} (${{ inputs.version }}) ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        args: ["", "--bash"]

    steps:
    - name: 🛒 Checkout repository
      uses: actions/checkout@v6

    - name: 🦀 Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: 🟣 Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: 🛠️ Build both CLIs
      run: |
        cargo build --release
        dotnet build -c Release src/dotnet/CurlGenerator/CurlGenerator.csproj

    - name: 🛠️ Prepare OpenAPI Spec
      id: prepare_openapi_spec
      run: |
        $filename = "./OpenAPI/${{ inputs.version }}/${{ inputs.openapi }}.${{ inputs.format }}"
        $exists = Test-Path -Path $filename -PathType Leaf
        if ($exists -eq $true) {
          Copy-Item $filename ./openapi.${{ inputs.format }}
          "exists=$true" >> $env:GITHUB_OUTPUT
        } else {
          "exists=$false" >> $env:GITHUB_OUTPUT
        }
      working-directory: test
      shell: pwsh

    - name: 🦀 Generate with the Rust CLI
      id: rust
      run: |
        New-Item -ItemType Directory -Path ./rust-out -Force | Out-Null
        $elapsed = Measure-Command {
          ../target/release/curlgenerator ./openapi.${{ inputs.format }} --output ./rust-out --no-logging ${{ matrix.args }}
        }
        "seconds=$([math]::Round($elapsed.TotalSeconds, 3))" >> $env:GITHUB_OUTPUT
      working-directory: test
      shell: pwsh
      if: steps.prepare_openapi_spec.outputs.exists == 'True'

    - name: 🟣 Generate with the legacy .NET CLI
      id: dotnet
      run: |
        New-Item -ItemType Directory -Path ./dotnet-out -Force | Out-Null
        $elapsed = Measure-Command {
          dotnet ../src/dotnet/CurlGenerator/bin/Release/net8.0/curlgenerator.dll ./openapi.${{ inputs.format }} --output ./dotnet-out --no-logging ${{ matrix.args }}
        }
        "seconds=$([math]::Round($elapsed.TotalSeconds, 3))" >> $env:GITHUB_OUTPUT
      working-directory: test
      shell: pwsh
      if: steps.prepare_openapi_spec.outputs.exists == 'True'

    - name: 🔍 Compare the generated file names
      run: |
        $rust = Get-ChildItem ./rust-out | Select-Object -ExpandProperty Name | Sort-Object
        $dotnet = Get-ChildItem ./dotnet-out | Select-Object -ExpandProperty Name | Sort-Object
        $difference = Compare-Object -ReferenceObject @($dotnet) -DifferenceObject @($rust)
        if ($difference) {
          $difference | Format-Table | Out-String | Write-Output
          throw "The two implementations generated different file names"
        }
        Write-Output "Both implementations generated $($rust.Count) identically named files"
      working-directory: test
      shell: pwsh
      if: steps.prepare_openapi_spec.outputs.exists == 'True'

    - name: ⏱️ Record timings
      run: |
        $rust = "${{ steps.rust.outputs.seconds }}"
        $dotnet = "${{ steps.dotnet.outputs.seconds }}"
        "| ${{ inputs.openapi }}.${{ inputs.format }} (${{ inputs.version }}) ${{ matrix.args }} | ${rust}s | ${dotnet}s |" >> $env:GITHUB_STEP_SUMMARY
      shell: pwsh
      if: steps.prepare_openapi_spec.outputs.exists == 'True'

    - name: 🗳️ Publish generated code as Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Generated Code (${{ inputs.openapi }}.${{ inputs.format }}, ${{ inputs.version }}, ${{ inputs.os }}, ${{ matrix.args }})
        path: |
          test/rust-out/*
          test/dotnet-out/*
      if: steps.prepare_openapi_spec.outputs.exists == 'True'

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: 🚚 Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@v6

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 💾 Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: 🛠️ Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: 📦 Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/curlgenerator dist/
          tar -C dist -czf curlgenerator-${{ matrix.target }}.tar.gz curlgenerator

      - name: 📦 Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\curlgenerator.exe dist\
          Compress-Archive -Path dist\curlgenerator.exe -DestinationPath curlgenerator-${{ matrix.target }}.zip

      - name: 🗳️ Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: curlgenerator-${{ matrix.target }}
          path: |
            curlgenerator-${{ matrix.target }}.tar.gz
            curlgenerator-${{ matrix.target }}.zip
          if-no-files-found: ignore

      - name: 🚀 Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            curlgenerator-${{ matrix.target }}.tar.gz
            curlgenerator-${{ matrix.target }}.zip

  publish-crate:
    name: 📦 Publish to crates.io
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@v6

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 📤 Publish
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

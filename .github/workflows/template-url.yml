name: Run Tests (URL)

on:
  workflow_call:
    inputs:
      openapi:
        required: true
        type: string
      os:
        type: string
        default: ubuntu-latest

jobs:

  test:

    name: ${{ inputs.openapi }} ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 15

    steps:
    - name: 🛒 Checkout repository
      uses: actions/checkout@v6

    - name: 🦀 Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: 🟣 Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: 🛠️ Build both CLIs
      run: |
        cargo build --release --locked
        dotnet build -c Release src/dotnet/CurlGenerator/CurlGenerator.csproj

    - name: 🦀 Generate with the Rust CLI
      run: ../target/release/curlgenerator "${{ inputs.openapi }}" --output ./rust-out --no-logging
      working-directory: test
      shell: pwsh

    - name: 🟣 Generate with the legacy .NET CLI
      run: dotnet ../src/dotnet/CurlGenerator/bin/Release/net8.0/curlgenerator.dll "${{ inputs.openapi }}" --output ./dotnet-out --no-logging
      working-directory: test
      shell: pwsh

    - name: 🔍 Compare the generated file names
      run: |
        $rust = Get-ChildItem ./rust-out | Select-Object -ExpandProperty Name | Sort-Object
        $dotnet = Get-ChildItem ./dotnet-out | Select-Object -ExpandProperty Name | Sort-Object
        $difference = Compare-Object -ReferenceObject @($dotnet) -DifferenceObject @($rust)
        if ($difference) {
          $difference | Format-Table | Out-String | Write-Output
          throw "The two implementations generated different file names"
        }
        Write-Output "Both implementations generated $($rust.Count) identically named files"
      working-directory: test
      shell: pwsh
